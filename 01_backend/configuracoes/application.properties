spring.application.name=sistema-pedidos-jack
server.port=8080
server.error.include-message=never

# Persistência local por padrão. Em produção, configure DB_URL, DB_USERNAME,
# DB_PASSWORD e DB_DRIVER para apontar para PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/jack;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
